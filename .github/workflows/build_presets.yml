name: build

on:
  push:
    branches-ignore:
      - dev
  pull_request:
    branches-ignore:
      - dev
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: Release
            image: devkitpro/devkita64:latest
            artifact_suffix: latest
          - os: ubuntu-latest
            preset: Release
            image: devkitpro/devkita64:20251231
            artifact_suffix: 20251231
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}

    steps:
    - uses: actions/checkout@v3

    # fetch latest cmake
    - uses: lukka/get-cmake@v3.31.6

    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Build release package
      run: sh ./build_release.sh

    - name: Deploy
      if: ${{ github.event_name != 'pull_request' && github.event.action != 'unassigned' }}
      uses: actions/upload-artifact@master
      with:
        name: sphaira-${{ matrix.preset }}-${{ matrix.artifact_suffix }}
        path: |
          build/${{ matrix.preset }}/sphaira.nro
          out/sphaira.zip
